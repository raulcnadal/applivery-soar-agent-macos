<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for MenuBarApp/AppIcon.icns — see that file's own note (next to
       Info.plist) for why this exists and how it's rasterized. Same
       shield-plus-checkmark glyph as the Windows Agent's tray icon
       (tray/icons/tray_light.ico / tray_dark.ico in that repo) and the
       SF Symbol "checkmark.shield" AppDelegate.swift currently draws for
       the NSStatusItem itself, on a brand-purple rounded-square backdrop
       (#8a3bff -> #6d10f0, matching frontend/public/favicon.svg's palette)
       so the app has a real icon at all rather than macOS's generic blank-
       circle placeholder for an unbundled/icon-less app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8a3bff"/>
      <stop offset="1" stop-color="#6d10f0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <g transform="translate(512,512)">
    <g transform="translate(-215,-235) scale(4.3)">
      <path d="M50 4
               C 66 4 80 10 88 16
               C 90 17.5 90 19 90 21
               L 90 50
               C 90 72 76 88 50 97
               C 24 88 10 72 10 50
               L 10 21
               C 10 19 10 17.5 12 16
               C 20 10 34 4 50 4
               Z"
            fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M31 51 L44 64 L71 34" fill="none" stroke="#ffffff" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
