name: Build macOS Agent Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Needed for the release step below to publish/update the "latest" tag's
# GitHub Release via the workflow's own auto-issued GITHUB_TOKEN — no PAT
# required for same-repo release publishing.
permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary (universal — arm64 + amd64)
        run: |
          mkdir -p build/payload/usr/local/bin
          mkdir -p build/payload/Library/LaunchDaemons

          # Build both architectures separately, then lipo them into one
          # universal binary — this Mac's own agent needs to run on both
          # Apple Silicon and Intel Macs without a separate .pkg per arch,
          # unlike the Windows agent (Windows doesn't have an equivalent to
          # lipo, so that repo ships two separate MSIs instead).
          #
          # Builds the whole package directory ("."), not an explicit file
          # list — an earlier version hardcoded the .go filenames here, which
          # silently excluded every file added after this script was
          # written (caught when customchecks_macos.go went in: it compiled
          # fine locally-reviewed but failed CI with "undefined: ..." for
          # every symbol the hardcoded list left out). "." picks up any file
          # in this repo automatically, matching the Windows agent's own
          # `go build ... .` in build.yml.
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o build/agent-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o build/agent-amd64 .
          lipo -create -output build/payload/usr/local/bin/applivery-soar-agent build/agent-arm64 build/agent-amd64
          lipo -info build/payload/usr/local/bin/applivery-soar-agent

          # Copy the LaunchDaemon plist into the package payload
          cp es.mi-labs.soar.agent.plist build/payload/Library/LaunchDaemons/es.mi-labs.soar.agent.plist

      - name: Create macOS Installer Package
        run: |
          mkdir -p build/scripts
          
          # Postinstall script to configure permissions and bootstrap the LaunchDaemon service
          cat << 'EOF' > build/scripts/postinstall
          #!/bin/bash

          # Set strict root ownership and permissions on binary
          chown root:wheel /usr/local/bin/applivery-soar-agent
          chmod 755 /usr/local/bin/applivery-soar-agent

          # Set strict root ownership and permissions on plist
          chown root:wheel /Library/LaunchDaemons/es.mi-labs.soar.agent.plist
          chmod 644 /Library/LaunchDaemons/es.mi-labs.soar.agent.plist

          # Load and start the service immediately via launchctl
          launchctl bootstrap system /Library/LaunchDaemons/es.mi-labs.soar.agent.plist 2>/dev/null || \
          launchctl load -w /Library/LaunchDaemons/es.mi-labs.soar.agent.plist

          exit 0
          EOF
          chmod +x build/scripts/postinstall

          pkgbuild --root build/payload \
                   --scripts build/scripts \
                   --identifier "es.mi-labs.soar.agent" \
                   --version "1.0.0" \
                   --install-location "/" \
                   Applivery-SOAR-Agent.pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applivery-SOAR-Agent-pkg
          path: Applivery-SOAR-Agent.pkg

      # Rolling "latest" GitHub Release, same tag reused on every push to
      # main — same pattern as applivery-soar's own docker-publish.yml
      # :latest tag, and the Windows agent repo's build.yml. This repo is
      # private, so the migrated SOAR app's Settings > Device Data Webhook
      # page proxies this release's asset through its own backend (needs a
      # read-scoped GitHub token, configured there) rather than linking to
      # github.com directly. PR builds only run the steps above (artifact
      # upload, for review) — only pushes to main publish a release.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automated build from ${{ github.sha }}
          make_latest: true
          files: Applivery-SOAR-Agent.pkg