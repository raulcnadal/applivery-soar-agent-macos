name: Build macOS Agent Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Needed for the release step below to publish/update the "latest" tag's
# GitHub Release via the workflow's own auto-issued GITHUB_TOKEN — no PAT
# required for same-repo release publishing.
permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # go.sum doesn't exist in this repo yet as of the fsnotify dependency
      # landing (eventwatch_macos.go, Event Watches / macOS parity roadmap
      # Phase 5) — the development sandbox that wrote this code has no
      # network access to the Go module checksum database to generate it by
      # hand. This runner does, so `go mod tidy` here is the actual source
      # of truth for go.sum (and would also correct go.mod if it were ever
      # hand-edited into an inconsistent state) before either GOARCH build
      # below runs.
      - name: go mod tidy
        run: go mod tidy

      - name: Build Binary (universal — arm64 + amd64)
        run: |
          mkdir -p build/payload/usr/local/bin
          mkdir -p build/payload/Library/LaunchDaemons

          # Build both architectures separately, then lipo them into one
          # universal binary — this Mac's own agent needs to run on both
          # Apple Silicon and Intel Macs without a separate .pkg per arch,
          # unlike the Windows agent (Windows doesn't have an equivalent to
          # lipo, so that repo ships two separate MSIs instead).
          #
          # Builds the whole package directory ("."), not an explicit file
          # list — an earlier version hardcoded the .go filenames here, which
          # silently excluded every file added after this script was
          # written (caught when customchecks_macos.go went in: it compiled
          # fine locally-reviewed but failed CI with "undefined: ..." for
          # every symbol the hardcoded list left out). "." picks up any file
          # in this repo automatically, matching the Windows agent's own
          # `go build ... .` in build.yml.
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o build/agent-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o build/agent-amd64 .
          lipo -create -output build/payload/usr/local/bin/applivery-soar-agent build/agent-arm64 build/agent-amd64
          lipo -info build/payload/usr/local/bin/applivery-soar-agent

          # Copy the LaunchDaemon plist into the package payload
          cp es.mi-labs.soar.agent.plist build/payload/Library/LaunchDaemons/es.mi-labs.soar.agent.plist

      # Phase 3 of the macOS parity roadmap — the SwiftUI menu bar app lives
      # in its own Swift Package (MenuBarApp/) rather than an .xcodeproj (see
      # MenuBarApp/Package.swift's doc comment for why), so `swift build` is
      # this step's equivalent of `go build` above: the actual compile
      # verification this repo has no other way to get, since no local
      # Xcode/Swift toolchain is available anywhere else in this project's
      # tooling.
      - name: Build Menu Bar App (universal — arm64 + amd64) and wrap into .app bundle
        run: |
          cd MenuBarApp
          swift build -c release --arch arm64 --arch x86_64
          cd ..

          APP="build/payload/Applications/Applivery SOAR.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # swift build --arch arm64 --arch x86_64 already emits a single
          # universal (lipo'd) binary under .build/apple/Products/Release/
          # when multiple --arch flags are passed in one invocation — no
          # separate lipo step needed here, unlike the Go binary above
          # (`go build` has no multi-arch-in-one-invocation equivalent).
          BIN="MenuBarApp/.build/apple/Products/Release/AppliverySOARMenuBar"
          if [ ! -f "$BIN" ]; then
            echo "Expected universal binary not found at $BIN — listing .build to help diagnose:"
            find MenuBarApp/.build -maxdepth 4 -type f -perm +111 2>/dev/null || true
            exit 1
          fi
          lipo -info "$BIN"
          cp "$BIN" "$APP/Contents/MacOS/AppliverySOARMenuBar"
          cp MenuBarApp/Info.plist "$APP/Contents/Info.plist"

          # App icon — Info.plist's CFBundleIconFile points at "AppIcon",
          # which resolves to this file once it's sitting directly in
          # Contents/Resources (NOT inside the SPM resource .bundle copied
          # below — CFBundleIconFile is only ever looked up at the top
          # level of Contents/Resources). Source/rationale: assets/app-icon.svg.
          cp MenuBarApp/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          # Bundled Outfit fonts (SPM's .copy("Resources/Fonts") resource
          # rule preserves the Fonts/ subdirectory inside the generated
          # resource bundle — FontLoader.swift looks them up via
          # Bundle.module with subdirectory:"Fonts" to match).
          RESOURCE_BUNDLE=$(find MenuBarApp/.build/apple/Products/Release -maxdepth 1 -iname "*.bundle" | head -n1)
          if [ -n "$RESOURCE_BUNDLE" ]; then
            cp -R "$RESOURCE_BUNDLE" "$APP/Contents/Resources/"
          else
            echo "Warning: no generated resource bundle found — the menu bar app will fall back to system fonts."
          fi

          # Ad-hoc signing only (Phase 0 — real Developer ID signing +
          # notarization is deferred until Applivery's own Developer account
          # team takes over, per backend/docs/macos-agent-parity-roadmap.md
          # §7). This is enough for the binary to launch at all under
          # Gatekeeper's runtime checks on the same machine that built it;
          # it is NOT a substitute for real signing before this ships to
          # customer fleets via MDM.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP" || true

          mkdir -p build/payload/Library/LaunchAgents
          cp es.mi-labs.soar.menubar.plist build/payload/Library/LaunchAgents/es.mi-labs.soar.menubar.plist

      - name: Create macOS Installer Package
        run: |
          mkdir -p build/scripts
          
          # Postinstall script to configure permissions and bootstrap both
          # the LaunchDaemon (agent) and, new in Phase 3, the LaunchAgent
          # (menu bar app) services.
          cat << 'EOF' > build/scripts/postinstall
          #!/bin/bash

          # Set strict root ownership and permissions on binary
          chown root:wheel /usr/local/bin/applivery-soar-agent
          chmod 755 /usr/local/bin/applivery-soar-agent

          # Set strict root ownership and permissions on plist
          chown root:wheel /Library/LaunchDaemons/es.mi-labs.soar.agent.plist
          chmod 644 /Library/LaunchDaemons/es.mi-labs.soar.agent.plist

          # Load and start the service immediately via launchctl. Same
          # upgrade gap as the menu bar LaunchAgent below: on a FRESH
          # install the job isn't loaded yet, so bootstrap/load actually
          # starts it — but on an UPGRADE it's already loaded from the
          # previous install, so bootstrap/load silently no-ops against the
          # still-running OLD daemon process, and the new
          # /usr/local/bin/applivery-soar-agent binary just copied in above
          # wouldn't actually run until the next reboot. kickstart -k
          # force-restarts an already-loaded job (kill + relaunch,
          # atomically) and is tried first; bootstrap/load remain the
          # fallback for a genuinely fresh install where kickstart has
          # nothing to restart yet.
          launchctl kickstart -k system/es.mi-labs.soar.agent 2>/dev/null || \
          launchctl bootstrap system /Library/LaunchDaemons/es.mi-labs.soar.agent.plist 2>/dev/null || \
          launchctl load -w /Library/LaunchDaemons/es.mi-labs.soar.agent.plist

          # --- Phase 3: menu bar app (LaunchAgent, per-console-user) ---

          # root:wheel + 755 recursively, same reasoning as the daemon
          # binary above — a world-writable app bundle would let any local
          # user tamper with what launchd/the console user's session runs.
          chown -R root:wheel "/Applications/Applivery SOAR.app"
          chmod -R 755 "/Applications/Applivery SOAR.app"

          chown root:wheel /Library/LaunchAgents/es.mi-labs.soar.menubar.plist
          chmod 644 /Library/LaunchAgents/es.mi-labs.soar.menubar.plist

          # A plain `cp` into /Library/LaunchAgents/ is picked up automatically
          # by launchd for every FUTURE login — but if someone is already
          # logged in at install time (the common case for an interactive
          # install, as opposed to zero-touch MDM enrollment pre-login), the
          # app won't appear in their menu bar until their next login unless
          # this script also bootstraps it into their already-running GUI
          # session right now. Mirrors the Windows agent's own installer
          # immediately re-firing the tray's Scheduled Task rather than
          # waiting for the next logon.
          # On a FRESH install the job isn't loaded yet, so bootstrap/load
          # is what actually starts it. On an UPGRADE it's already loaded
          # from a previous install, so bootstrap/load silently no-ops
          # against the still-running OLD process — the new binary just
          # copied into the .app bundle wouldn't take effect until the user
          # happens to log out and back in. `launchctl kickstart -k`
          # force-restarts an already-loaded job (kill + relaunch, in one
          # atomic launchd call), which is what actually picks up the new
          # binary immediately; it's tried first and only falls through to
          # bootstrap/load if the job isn't loaded at all yet. Mirrors the
          # Windows agent's own StopTrayProcess + RestartTrayTask pair in
          # agent.wxs (same problem, same fix, different OS's service
          # manager).
          CONSOLE_USER=$(stat -f%Su /dev/console 2>/dev/null)
          CONSOLE_UID=$(stat -f%u /dev/console 2>/dev/null)
          if [ -n "$CONSOLE_USER" ] && [ "$CONSOLE_USER" != "root" ] && [ -n "$CONSOLE_UID" ]; then
            launchctl asuser "$CONSOLE_UID" launchctl kickstart -k "gui/$CONSOLE_UID/es.mi-labs.soar.menubar" 2>/dev/null || \
            launchctl asuser "$CONSOLE_UID" launchctl bootstrap "gui/$CONSOLE_UID" /Library/LaunchAgents/es.mi-labs.soar.menubar.plist 2>/dev/null || \
            launchctl asuser "$CONSOLE_UID" launchctl load -w /Library/LaunchAgents/es.mi-labs.soar.menubar.plist 2>/dev/null || true
          fi

          exit 0
          EOF
          chmod +x build/scripts/postinstall

          pkgbuild --root build/payload \
                   --scripts build/scripts \
                   --identifier "es.mi-labs.soar.agent" \
                   --version "1.0.0" \
                   --install-location "/" \
                   Applivery-SOAR-Agent.pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applivery-SOAR-Agent-pkg
          path: Applivery-SOAR-Agent.pkg

      # Publish the universal .pkg to the SOAR backend's own zero-config
      # download endpoint (POST /api/internal/agent-builds/macos) — same
      # mechanism and reasoning as the Windows agent repo's own build.yml
      # ("Publish x64 MSI to SOAR backend" step): lets a customer download
      # the agent from Settings > Applivery SOAR Agent with no GitHub token,
      # same idea as this app's own public Docker images. Requires the
      # SOAR_AGENT_BUILD_SECRET repo secret, matching AGENT_BUILD_INGEST_SECRET
      # on the backend deployment. Runs on push to main only.
      - name: Publish .pkg to SOAR backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOAR_BASE_URL: ${{ vars.SOAR_BASE_URL || 'https://soar.mi-labs.es' }}
          SOAR_AGENT_BUILD_SECRET: ${{ secrets.SOAR_AGENT_BUILD_SECRET }}
        run: |
          if [ -z "$SOAR_AGENT_BUILD_SECRET" ]; then
            echo "SOAR_AGENT_BUILD_SECRET is not set on this repo — skipping zero-config publish (the GitHub Release below still publishes normally)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$SOAR_BASE_URL/api/internal/agent-builds/macos" \
            -H "X-Agent-Build-Secret: $SOAR_AGENT_BUILD_SECRET" \
            -H "X-Agent-Filename: Applivery-SOAR-Agent.pkg" \
            -H "X-Agent-Content-Type: application/vnd.apple.installer+xml" \
            -H "X-Agent-Version: ${{ github.sha }}" \
            --data-binary @Applivery-SOAR-Agent.pkg

      # Rolling "latest" GitHub Release, same tag reused on every push to
      # main — same pattern as applivery-soar's own docker-publish.yml
      # :latest tag, and the Windows agent repo's build.yml. This repo is
      # private, so the migrated SOAR app's Settings > Applivery SOAR Agent
      # page proxies this release's asset through its own backend (needs a
      # read-scoped GitHub token, configured there) rather than linking to
      # github.com directly. PR builds only run the steps above (artifact
      # upload, for review) — only pushes to main publish a release.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automated build from ${{ github.sha }}
          make_latest: true
          files: Applivery-SOAR-Agent.pkg